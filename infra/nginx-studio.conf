# Include inside the existing HTTPS server block only after backing it up.
# Build web with VITE_BASE_PATH=/studio/; set APP_BASE_PATH=/studio/.
location = /studio { return 308 /studio/; }
location ^~ /studio/api/streams/ { return 404; }
location ^~ /studio/api/payments/ { return 404; }
location ^~ /studio/media/ {
    proxy_pass http://127.0.0.1:18891/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect ~^(/live/.*)$ /studio/media$1;
    proxy_cookie_path / /studio/media/;
    proxy_buffering off;
    proxy_read_timeout 30s;
}
location ^~ /studio/ {
    proxy_pass http://127.0.0.1:18890/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 32k;
    proxy_read_timeout 15s;
}
