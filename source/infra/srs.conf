# Local development only. See docs/streaming.md for on_publish auth.
listen 1935;
max_connections 1000;
daemon off;
srs_log_tank console;
http_api {
    enabled on;
    listen 1985;
    crossdomain off;
}
http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
    crossdomain on;
}
vhost __defaultVhost__ {
    hls {
        enabled on;
        hls_path ./objs/nginx/html;
        hls_fragment 2;
        hls_window 10;
    }
}
